packages:
  - dashboard/*
  - adapters/*
  # The ensemble/retrace npm distributions: each is a @caribou-crew/<name>
  # wrapper plus one package per platform, carrying a prebuilt binary
  # (populated by scripts/prepare-npm-binary.mjs at release time — see
  # npm/ensemble/README.md and npm/retrace/README.md).
  - npm/*
  # The sample stack's browser client is a workspace member so it can depend
  # on adapters/playwright through `workspace:*` — a real consumer link
  # against the same @playwright/test instance the suite runs on. npm's
  # `file:` alternative symlinks the adapter with its own node_modules
  # attached, which gives the fixture a SECOND copy of @playwright/test and
  # a `test()` the runner does not recognize.
  #
  # Its browser suite is deliberately not named `test`: it needs the sample
  # stack running, so `pnpm -r --if-present test` — what CI runs — must not
  # pick it up. See sample/clients/web-app/package.json.
  - sample/clients/*
