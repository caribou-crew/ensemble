name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Scaffolding only. The scope question IS now settled — packages publish
  # under @caribou-crew, which the maintainer owns — so do NOT read the old
  # "once the scope is decided" note as a green light. This job stays off
  # until the maintainer has synced npm credentials into the repo secrets and
  # says so; publishing is theirs to authorize, not a condition an agent can
  # observe as met. Enabling it also needs a real publish step (the run below
  # is a placeholder) and `--access public`, since @caribou-crew packages are
  # private by default.
  npm-publish:
    if: false # maintainer flips this after syncing npm credentials
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: echo "pending npm details"
