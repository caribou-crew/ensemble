name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The scope question IS settled — packages publish under @caribou-crew,
  # which the maintainer owns — so do NOT read the old "once the scope is
  # decided" note as a green light. This job stays off until the maintainer
  # has synced npm credentials into the repo secrets (NPM_TOKEN) and says so;
  # publishing is theirs to authorize, not a condition an agent can observe
  # as met. Enabling it also needs clearing "private": true in each of
  # adapters/js/package.json, adapters/playwright/package.json,
  # adapters/maestro/package.json, npm/retrace/package.json, and the four
  # npm/retrace-<platform>/package.json files — that flag is this job's
  # mirror image (package-level "no accidental publish", see each package's
  # README), and `npm publish` fails hard on all of them until it's cleared.
  npm-publish:
    if: false # maintainer flips this after syncing npm credentials
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Compute release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # goreleaser's own job already built and archived these; this job runs
      # separately (own runner, no dist/), so it re-fetches the four
      # linux/darwin archives from the release goreleaser just published and
      # unpacks each binary to where scripts/prepare-npm-retrace.mjs expects
      # it: .npm-stage/<node-platform>-<node-arch>/retrace.
      - name: Stage platform binaries from the release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p .npm-stage
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'retrace_*_darwin_*.tar.gz' \
            --pattern 'retrace_*_linux_*.tar.gz' \
            --dir .npm-stage
          for archive in .npm-stage/retrace_*.tar.gz; do
            # retrace_0.0.1_linux_amd64.tar.gz -> linux-amd64, then amd64 -> x64
            goos_goarch=$(basename "$archive" .tar.gz | sed -E 's/^retrace_[^_]+_//')
            platform=$(echo "$goos_goarch" | sed -E 's/_/-/; s/amd64/x64/')
            mkdir -p ".npm-stage/$platform"
            tar xzf "$archive" -C ".npm-stage/$platform" retrace
          done

      - name: Pack npm packages
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/prepare-npm-retrace.mjs

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in npm/retrace-darwin-arm64 npm/retrace-darwin-x64 \
                     npm/retrace-linux-arm64 npm/retrace-linux-x64 npm/retrace; do
            npm publish --access public "$pkg"
          done
