name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    # Without this, a hung step runs to GitHub's 6-hour default before anyone
    # sees red. The Go suite's own worst case is retrace/cmd/retrace at ~215s,
    # so the whole job sits comfortably inside 25 minutes; anything past that
    # is wedged, not slow. See also the timeout on `docker info` in
    # ensemble/orchestrator/docker_integration_test.go — a skip-guard with no
    # timeout of its own is how a job hangs here in the first place.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # cmd_run_adapters_test.go (Task 17 Step 5) is the only test that
      # crosses the adapters(TS)/retrace(Go) boundary. It needs node+pnpm to
      # build @caribou-crew/retrace-js before it can run — without this, the
      # `go` job has no toolchain to run it with, and it must not just skip
      # quietly (see the `CI` gate in that file).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: go vet ./core/... ./ensemble/... ./retrace/...
      - run: go test -race ./core/... ./ensemble/... ./retrace/...
      - name: goreleaser config check
        uses: goreleaser/goreleaser-action@v6
        with:
          args: check

  ts:
    runs-on: ubuntu-latest
    # The JS suite runs in well under a minute; 15 is pure headroom. Same
    # reasoning as the `go` job: a ceiling exists so a hang reports as a hang.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present test
