# Example CI workflow for a team running retrace across multiple apps
# (iOS, Android, React Native, web, ...). This is a template to copy into
# your OWN repo and adapt — it is not run by this repo's own CI.
#
# What each job does:
#   1. `retrace run` records the flow(s) against your test command, the
#      same way it would on a developer's machine.
#   2. `retrace export` renders a static, human-browsable report and its
#      exit code gates the job (0 pass, 1 changed, 2 failed, 3
#      quarantined) — see retrace/serve/export.go's own doc comment for
#      why "quarantined" is the highest code, not the lowest.
#   3. Upload of `.retrace/runs/<app>` is the artifact `retrace sync
#      --from github` later pulls onto a developer's machine, so it must
#      be `.retrace/runs`, not `.retrace/runs/<app>` — the upload path
#      decides what directory structure survives inside the artifact, and
#      sync expects to find `<app>/<flow>/<run-id>/manifest.json` intact.
#
# `retrace sync --from github --repo <org>/<repo>` (run locally, or from
# `ensemble up`'s Retrace tab via "Sync now") then merges these artifacts
# into your local `.retrace/runs/`, where the existing review queue
# (`retrace serve`, or the ensemble dashboard's Retrace tab) diffs them
# against whatever reference you've already accepted with `retrace ref
# accept`.
#
# If your retrace.yaml has any `redact:` entry with `mode: encrypt`, set
# RETRACE_RECORDING_KEY from a secret — same env var name whether it's read
# by `retrace run` (capture: wraps that run's data key under it — with no
# key resolvable, capture refuses rather than write an encrypt rule's
# field unredacted), or by `retrace diff` / `retrace replay` / `retrace
# export` (decrypts an `$enc:v1:…` marker back to the real value; without
# the key they still run, but every encrypted field stays a marker, never
# the plaintext). See the retrace-iterate skill's "Field-level encryption"
# section and openspec/changes/retrace-recording-encryption/design.md.

name: retrace
on:
  push:
    branches: [main]
  pull_request:

jobs:
  retrace-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # ... set up your app's build + test toolchain here ...
      - run: retrace run --app ios -- <your iOS test command>
      - run: retrace export --out ./report --app ios --json
      - uses: actions/upload-artifact@v4
        if: always() # a failing run is exactly the one you want to sync
        with:
          name: retrace-runs-ios-${{ github.sha }}
          path: .retrace/runs
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrace-report-ios-${{ github.sha }}
          path: ./report
          retention-days: 7

  retrace-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: retrace run --app android -- <your Android test command>
      - run: retrace export --out ./report --app android --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrace-runs-android-${{ github.sha }}
          path: .retrace/runs
          retention-days: 7

  retrace-ios-maestro:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # ... set up your iOS build + Maestro CLI here ...
      - run: retrace run --app ios -- maestro test flows/checkout.yaml
      # Maestro has no in-process hook to attach evidence automatically —
      # unlike Playwright's reporter below, this is an explicit step. The
      # env vars (RETRACE_RUN_DIR / RETRACE_STRICT) are the same handshake
      # `retrace run` already set for the `maestro test` step above; this
      # step runs AFTER it, once Maestro has finished writing its own
      # recording/screenshots.
      - run: |
          node node_modules/@caribou-crew/retrace-maestro/bin/retrace-maestro.mjs attach video ~/.maestro/tests/latest/recording.mp4
          node node_modules/@caribou-crew/retrace-maestro/bin/retrace-maestro.mjs attach report ~/.maestro/tests/latest/
      - run: retrace export --out ./report --app ios --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrace-runs-ios-${{ github.sha }}
          path: .retrace/runs
          retention-days: 7

  retrace-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # RETRACE_RECORDING_KEY only needs to be set on steps that touch an
      # encrypt-mode field — harmless to set on every step here, since a
      # project with no `mode: encrypt` rule just never reads it.
      #
      # Register the video/report reporter in YOUR playwright.config.ts:
      #   import RetraceEvidenceReporter from '@caribou-crew/retrace-playwright/reporter';
      #   export default defineConfig({
      #     use: { video: 'on' },
      #     reporter: [['html', { outputFolder: 'playwright-report' }], [RetraceEvidenceReporter]],
      #   });
      # No extra CI step needed for Playwright — every test's video (if
      # `use: { video: 'on' }`) and the HTML report (once the html reporter
      # above finishes) are copied into this run's videos/ and report/
      # automatically, and `retrace sync` already carries a run's whole
      # directory — see docs/retrace-ci-sync.md.
      - run: retrace run --app web -- <your web test command>
        env:
          RETRACE_RECORDING_KEY: ${{ secrets.RETRACE_RECORDING_KEY }}
      - run: retrace export --out ./report --app web --json
        env:
          RETRACE_RECORDING_KEY: ${{ secrets.RETRACE_RECORDING_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrace-runs-web-${{ github.sha }}
          path: .retrace/runs
          retention-days: 7
