services:
  edge:
    dir: ./services/edge
    run: node server.js
    port: 8080
    proxy: 9080
    health: /healthz
    entry: true
    depends_on: [catalog]

  catalog:
    dir: ./services/catalog
    run: ./gradlew bootRun
    port: 8081
    proxy: 9081
    health: /actuator/health

stubs:
  payments:
    port: 9099
    routes:
      - match: { method: POST, path: /charges }
        respond:
          status: 201
          headers: { content-type: application/json }
          body: '{"id":"ch_1","status":"succeeded"}'

# One public port routed by path prefix onto the services above (and the
# payments stub) — the built-in edge router. Routes forward onto each
# target's proxy port, so gateway -> service hops are captured too. Point
# your client at 127.0.0.1:9000 instead of the individual proxy ports.
#
# Prefix routes are tried first (longest prefix wins); a regex route is
# only considered when no prefix matches, so the /images suffix rule below
# never shadows /products or /pay. Regex is a plain Go regexp with no
# implicit anchoring — write ^ / $ yourself.
#
# rewrite replaces the matched portion instead of just removing it: /v1
# below forwards to catalog as /api/v1 (strip_prefix could only get you to
# /, dropping v1 entirely). cors is opt-in per gateway — omit it and a
# gateway behaves exactly as before (no headers, no preflight handling).
gateways:
  public:
    port: 9000
    cors:
      allow_origins: ["http://localhost:5173"]
      allow_methods: [GET, POST, PUT, DELETE, OPTIONS]
      allow_headers: [Content-Type, Authorization]
    routes:
      - { prefix: /products, service: catalog }
      - { prefix: /pay,      service: payments, strip_prefix: true }
      - { prefix: /v1,       service: catalog, rewrite: /api/v1 }
      - { regex: '\.(jpg|png)$', service: catalog }
      - { prefix: /,         service: edge }
