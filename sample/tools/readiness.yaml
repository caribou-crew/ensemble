# Post-on_ready readiness checks for the "brew" sample stack — see
# ensemble.yaml's top-level `readiness:` key, which points here.
#
# `ensemble up` brings every service up healthy, then on_ready would seed
# baseline data (see seeds.baseline) if this stack wired one. Neither step
# proves the stack is actually queryable end-to-end the way a client would
# see it — these checks do: real HTTP requests against each service's own
# health endpoint, gated the same way `ensemble ready` gates CI.
checks:
  - name: catalog-healthy
    service: catalog
    path: /healthz
    assert:
      status: 200

  - name: ops-bff-healthy
    service: ops
    path: /healthz
    # headers_from demonstrates the auth-header mechanism: the script's
    # stdout lines become request headers (see readiness-auth.sh). ops-bff
    # itself doesn't require auth, so this header is sent but ignored —
    # swap the script's contents for a real one against a service that does.
    headers_from: ./readiness-auth.sh
    assert:
      status: 200
