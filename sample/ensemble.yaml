# "brew" sample stack (see openspec/changes/init-ensemble-retrace/design.md
# §8, tasks.md Phase 5). Money path: client -> edge-gw -> storefront-bff ->
# order -> (catalog-svc + user-svc + payments stub) -> redis ->
# notify-worker. ops-bff is a read-only internal aggregator over
# catalog-svc/order. order is a variants: service (see its entry below):
# `stub` (plain Go, no JDK/MySQL) is the default so the money path works
# out of the box; `real` is the Java/Spring/MySQL implementation, opt in
# with `ensemble variant order real` or `ensemble up --variant order=real`.
#
# Not built yet: the rn-app (Expo) client — task 5.2 remainder. web-app
# (React/Vite) is here, served by its own Vite dev server and talking to
# edge-gw's proxy port directly from the browser — see clients/web-app.
services:
  edge:
    dir: ./services/edge-gw
    # GOWORK=off: this is a standalone module deliberately outside the
    # repo's go.work (see sample/services/edge-gw/main.go's doc comment) —
    # without it, Go auto-detects the parent go.work and refuses to build
    # a module that isn't listed in it.
    build: GOWORK=off go build -o edge-gw .
    run: ./edge-gw
    port: 8080
    proxy: 9080
    env:
      PORT: "8080"
      CATALOG_URL: "http://127.0.0.1:9081"
      STOREFRONT_URL: "http://127.0.0.1:9085"
    health: /healthz
    entry: true
    depends_on: [catalog, storefront]

  catalog:
    dir: ./services/catalog-svc
    # GOWORK=off: same reasoning as edge-gw above.
    build: GOWORK=off go build -o catalog-svc .
    run: ./catalog-svc
    port: 8081
    proxy: 9081
    env:
      PORT: "8081"
      DATABASE_URL: "postgres://catalog:catalog@127.0.0.1:55432/catalog?sslmode=disable"
      PAYMENTS_URL: "http://127.0.0.1:9099"
    health: /healthz
    depends_on: [postgres]

  user:
    dir: ./services/user-svc
    build: npm install
    run: node index.js
    port: 8082
    proxy: 9082
    env:
      PORT: "8082"
      # Same Postgres instance as catalog, different schema (users.accounts
      # vs catalog's public.products) — "brew" deliberately shares one
      # Postgres container across two schemas rather than running two.
      DATABASE_URL: "postgres://catalog:catalog@127.0.0.1:55432/catalog?sslmode=disable"
    health: /healthz
    depends_on: [postgres]

  # Exercises ensemble's variants: feature — two backings of one logical
  # service, same port/proxy/health/depends_on (see service-variants spec).
  # `stub` (order-stub, plain Go, no datastore) is the default so the money
  # path — checkout, ops-bff's /admin/orders — actually works with no JDK
  # and no MySQL schema wait; `real` is the Java/Spring/MySQL
  # implementation order-svc always was. Swap in the real one with
  # `ensemble variant order real` or `ensemble up --variant order=real`;
  # `ensemble variant order stub` (or a restart) swaps back. Both variants
  # implement the identical /orders contract (see order-stub/main.go's doc
  # comment), so storefront-bff/ops-bff never know which one they're
  # talking to.
  order:
    port: 8083
    proxy: 9083
    health: /actuator/health
    depends_on: [mysql, redis, catalog, user]
    default: stub
    variants:
      stub:
        dir: ./services/order-stub
        build: GOWORK=off go build -o order-stub .
        run: ./order-stub
        env:
          PORT: "8083"
          CATALOG_URL: "http://127.0.0.1:9081"
          USER_URL: "http://127.0.0.1:9082"
          PAYMENTS_URL: "http://127.0.0.1:9099"
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: "56379"
      real:
        dir: ./services/order-svc
        build: ./gradlew bootJar --console=plain
        run: java -jar build/libs/order-svc-0.0.1.jar
        env:
          PORT: "8083"
          DATASOURCE_URL: "jdbc:mysql://127.0.0.1:53306/orders"
          DATASOURCE_USER: orders
          DATASOURCE_PASSWORD: orders
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: "56379"
          CATALOG_URL: "http://127.0.0.1:9081"
          USER_URL: "http://127.0.0.1:9082"
          PAYMENTS_URL: "http://127.0.0.1:9099"
        startup_timeout_s: 120

  notify:
    dir: ./services/notify-worker
    build: GOWORK=off go build -o notify-worker .
    run: ./notify-worker
    port: 8084
    proxy: 9084
    env:
      PORT: "8084"
      REDIS_URL: "redis://127.0.0.1:56379"
    health: /healthz
    depends_on: [redis]

  storefront:
    dir: ./services/storefront-bff
    build: npm install
    run: node index.js
    port: 8085
    proxy: 9085
    env:
      PORT: "8085"
      CATALOG_URL: "http://127.0.0.1:9081"
      ORDER_URL: "http://127.0.0.1:9083"
      DYNAMODB_URL: "http://127.0.0.1:58000"
      DYNAMODB_TABLE: carts
    health: /healthz
    depends_on: [catalog, dynamodb]

  ops:
    dir: ./services/ops-bff
    build: npm install
    run: node index.js
    port: 8086
    proxy: 9086
    env:
      PORT: "8086"
      CATALOG_URL: "http://127.0.0.1:9081"
      ORDER_URL: "http://127.0.0.1:9083"
    health: /healthz
    depends_on: [catalog]

  web:
    dir: ./clients/web-app
    # pnpm, not npm, unlike the node services above: web-app is a member of
    # the repo's pnpm workspace so it can link adapters/playwright by
    # `workspace:*` for `retrace run` — see pnpm-workspace.yaml and
    # ../retrace.yaml.
    build: pnpm install
    run: pnpm run dev
    port: 5173
    proxy: 9087
    env:
      # Vite only exposes VITE_-prefixed env vars to the browser bundle
      # (import.meta.env) — this is a genuine build/runtime input, not
      # server-side config, so it goes through the same env: mechanism as
      # every other service's config.
      VITE_EDGE_URL: "http://127.0.0.1:9080"
    # No health: path — vite's dev server has no /healthz route, so this
    # falls back to gateHealth's plain TCP-dial check on port, which is
    # exactly right for a plain HTTP server with no health endpoint.
    depends_on: [edge]

databases:
  postgres:
    image: postgres:16
    port: 55432
    env:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    seed: baseline

  mysql:
    image: mysql:8.0
    port: 53306
    env:
      MYSQL_ROOT_PASSWORD: orders
      MYSQL_DATABASE: orders
      MYSQL_USER: orders
      MYSQL_PASSWORD: orders

  redis:
    image: redis:7
    port: 56379

  dynamodb:
    image: amazon/dynamodb-local
    port: 58000

stubs:
  # Only payments sits on the money path (catalog-svc calls it on purchase).
  # analytics and kms are unwired decorations — nothing in the sample calls
  # them yet — kept only so the topology has the third-party edge nodes the
  # design calls for; wire a real caller into either before relying on them
  # for a demo.
  payments:
    port: 9099
    routes:
      - match: { method: POST, path: /charges }
        respond:
          status: 201
          headers: { content-type: application/json }
          body: '{"id":"ch_1","status":"succeeded"}'

  analytics:
    port: 9098
    routes:
      - match: { method: POST, path: /events }
        respond:
          status: 202
          headers: { content-type: application/json }
          body: '{"accepted":true}'

  kms:
    port: 9097
    routes:
      - match: { method: POST, path: /encrypt }
        respond:
          status: 200
          headers: { content-type: application/json }
          body: '{"ciphertext":"stub-ciphertext"}'

# Exercises the dashboard's Entities tab: a generic CRUD view over
# catalog-svc's existing /products REST resource — no per-entity code, just
# base + id. Points at catalog's *proxy* port (9081, not its real port
# 8081), so creates/edits/deletes made from the Entities tab show up in
# Traffic too, same as any other captured hop.
entities:
  products:
    base: http://127.0.0.1:9081/products
    id: id

# Exercises ensemble's own gateways: feature (distinct from edge-gw above,
# which is a real Go service the sample app happens to call "edge" — this
# is ensemble's config-only router). `curl http://127.0.0.1:9100/bff/healthz`
# produces a two-hop chain — client -> public, public -> storefront — recorded
# in real causal order (client -> gateway before gateway -> bff), not raw
# recording order (see core/proxy/proxy.go: hops are recorded inner-first,
# so gateway -> bff is Recorded before client -> gateway). No
# expose_in_traffic here on purpose: it's the default (collapsed) case, so
# the dashboard's Traffic tab shows this as client -> storefront — flip the
# tab's "show gateways" toggle, or add `expose_in_traffic: true` below, to
# see the public -> storefront leg on its own.
gateways:
  public:
    port: 9100
    routes:
      - { prefix: /bff, service: storefront, strip_prefix: true }

# Turns on the dashboard's Retrace tab (openspec/changes/retrace-ci-sync).
# `dir` is omitted: .retrace/ sits right next to this file, populated by
# `retrace run` locally (the runs themselves are gitignored — only
# .retrace-ref/'s accepted reference bundle is committed, same as any
# other retrace project). "Sync now" in the tab needs `repo` and `gh`
# authenticated locally, same as the CLI's own `retrace sync` would.
retrace:
  repo: caribou-crew/ensemble

# See tools/readiness.yaml: checks that run once, after on_ready, asserting
# the seeded stack is actually queryable end-to-end — not just that every
# service reports healthy. `ensemble ready` blocks on this; `ensemble up`
# itself does not (see the readiness-checks proposal's async design).
readiness:
  file: tools/readiness.yaml
  timeout_s: 30
  retry_interval_s: 2

seeds:
  baseline:
    sql:
      - database: postgres
        file: ./seeds/baseline.sql
      - database: postgres
        file: ./seeds/users.sql

  empty:
    sql:
      - database: postgres
        file: ./seeds/empty.sql
    # Deliberately doesn't touch mysql: orders/order_items only exist once
    # order-svc has connected at least once (Hibernate ddl-auto=update
    # creates them lazily), so a blind TRUNCATE there would fail on a
    # stack that never opted into the `real` order variant.

  bulk:
    sql:
      - database: postgres
        file: ./seeds/bulk.sql

  outage:
    http:
      # Not a hard failure (ensemble's latency mechanism injects delay, not
      # faults) — this simulates a badly degraded catalog: 5s added to
      # every request. Targets the control plane's default address; if you
      # run `ensemble up --api <other>`, re-arm by hand instead:
      # `ensemble latency set --target catalog --path / --fixed 5000 --enabled`.
      - method: PUT
        url: "http://127.0.0.1:4700/api/latency"
        headers: { content-type: application/json }
        body: '{"target":"catalog","path":"/","fixedMs":5000,"enabled":true}'
