# "brew" sample stack — vertical slice 1 of Phase 5 (see
# openspec/changes/init-ensemble-retrace/{design.md §8, tasks.md 5.1}).
#
# Wired so far: client -> edge-gw (auth stub) -> catalog-svc (Postgres,
# real CRUD) -> payments stub, a real 3-hop trace end to end. The rest of
# the "brew" stack (user-svc, order-svc, notify-worker, storefront-bff,
# ops-bff, the two clients) is not built yet — see tasks.md 5.1/5.2.
services:
  edge:
    dir: ./services/edge-gw
    # GOWORK=off: this is a standalone module deliberately outside the
    # repo's go.work (see sample/services/edge-gw/main.go's doc comment) —
    # without it, Go auto-detects the parent go.work and refuses to build
    # a module that isn't listed in it.
    build: GOWORK=off go build -o edge-gw .
    run: ./edge-gw
    port: 8080
    proxy: 9080
    env:
      PORT: "8080"
      CATALOG_URL: "http://127.0.0.1:9081"
    health: /healthz
    entry: true
    depends_on: [catalog]

  catalog:
    dir: ./services/catalog-svc
    # GOWORK=off: same reasoning as edge-gw above.
    build: GOWORK=off go build -o catalog-svc .
    run: ./catalog-svc
    port: 8081
    proxy: 9081
    env:
      PORT: "8081"
      DATABASE_URL: "postgres://catalog:catalog@127.0.0.1:55432/catalog?sslmode=disable"
      PAYMENTS_URL: "http://127.0.0.1:9099"
    health: /healthz
    depends_on: [postgres]

databases:
  postgres:
    image: postgres:16
    port: 55432
    env:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    seed: baseline

stubs:
  payments:
    port: 9099
    routes:
      - match: { method: POST, path: /charges }
        respond:
          status: 201
          headers: { content-type: application/json }
          body: '{"id":"ch_1","status":"succeeded"}'

seeds:
  baseline:
    sql:
      - database: postgres
        file: ./seeds/baseline.sql
