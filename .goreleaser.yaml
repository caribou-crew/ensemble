# goreleaser configuration (v2 schema)
#
# Builds and packages the two ensemble binaries (ensemble, retrace) for tagged
# releases. Triggered by .github/workflows/release.yml on `v*` tag pushes.
#
# Release publishing is intentionally draft-only right now (see `release:`
# below) — nothing goes out automatically until this is reviewed. Making a
# draft public, and publishing npm/ensemble* + npm/retrace* to npm, is a
# separate manually-triggered step: .github/workflows/publish.yml.
#
# Homebrew tap publishing is intentionally ABSENT from this config for now —
# blocked on a tap repo location decision nobody has made yet. Add `brews:`
# once that lands.

version: 2

project_name: ensemble

# The dashboard is embedded into the ensemble binary at compile time via
# go:embed (see ensemble/server/ui/ui.go); without building it first, the
# release binary ships the committed placeholder ("UI not built ..."). The
# release workflow (.github/workflows/release.yml) sets up pnpm/node before
# invoking goreleaser so these hooks can run.
before:
  hooks:
    - pnpm install --frozen-lockfile
    - pnpm -r build

builds:
  - id: ensemble
    dir: ensemble
    main: ./cmd/ensemble
    binary: ensemble
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

  - id: retrace
    dir: retrace
    main: ./cmd/retrace
    binary: retrace
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: ensemble
    ids: [ensemble]
    name_template: >-
      ensemble_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: retrace
    ids: [retrace]
    name_template: >-
      retrace_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

release:
  draft: true
